[workspace]
members = [
    "gatk-core",
    "gatk-cli",
    "gatk-haplotypecaller",
    "gatk-common",
    "gatk-rs-equiv",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GATK-RS Contributors"]
license = "Apache-2.0"
homepage = "https://github.com/gatk-rs/gatk-rs"
repository = "https://github.com/gatk-rs/gatk-rs"
description = "A native Rust implementation of the Genome Analysis Toolkit (GATK)"
rust-version = "1.75"

[workspace.dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "help", "usage", "error-context"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Parallelism and async
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"

# Memory management
memmap2 = "0.9"
crossbeam = "0.8"
dashmap = "5.5"
lru = "0.12"
bytes = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Mathematics and statistics
ndarray = "0.15"
statrs = "0.19"
num-traits = "0.2"

# Bioinformatics I/O
rust-htslib = "0.46"
# rust-htslib 0.46 casts lengths as u64; hts-sys ≥2.2 uses usize in bindings.
hts-sys = "=2.1.4"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.8"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.1", features = ["serde"] }
itertools = "0.12"

# Benchmarking
num_cpus = "1.16"
fastrand = "2.0"

# Distributed Computing
polars = { version = "0.38", features = ["lazy", "temporal", "strings", "parquet"] }
futures = "0.3"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

# Benchmarks inherit `release` settings; disable LTO here so `cargo bench` stays
# within typical CI/Docker memory limits while compiling heavy workspace deps (e.g. polars).
[profile.bench]
inherits = "release"
debug = true
lto = false
codegen-units = 16
