name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC every day
  workflow_dispatch:

jobs:
  nightly-test:
    name: Nightly Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows omitted: hts-sys needs OpenSSL includes on GH windows-latest (same as ci.yml).
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-nightly-

    - name: Update dependencies
      run: cargo update

    - name: Install samtools
      run: |
        set -euo pipefail
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          brew install samtools
        else
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends samtools
        fi
        command -v samtools

    - name: Stage indexed BAMs from fixture SAMs
      run: |
        set -euo pipefail
        chmod +x scripts/ci/stage_indexed_fixture_bams.sh
        ./scripts/ci/stage_indexed_fixture_bams.sh

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      # Lint debt: warn-only, libs/bins only (integration tests need feature gates).
      run: cargo clippy --workspace

    - name: Build
      env:
        CARGO_BUILD_JOBS: "1"
      run: cargo build --workspace --verbose

    - name: Run tests
      env:
        CARGO_BUILD_JOBS: "1"
      run: cargo test --workspace --all-features --verbose

    - name: Run canonical gatk-core tests
      env:
        CARGO_BUILD_JOBS: "1"
      run: cargo test -p gatk-core --release --tests --all-features

  nightly-benchmark:
    name: Nightly Benchmarks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-bench-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly-bench-

    - name: Build release
      run: cargo build --workspace --release

    # Criterion-only packages (harness = false). libtest benches reject --output-format.
    - name: Run benchmarks (bencher format for github-action-benchmark)
      run: |
        set -euo pipefail
        cargo bench -p gatk-core -p gatk-haplotypecaller -- --output-format bencher \
          | tee benchmark-output.txt

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'cargo'
        output-file-path: benchmark-output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Advisory: do not fail the nightly on regression alerts.
        fail-on-alert: false

  nightly-coverage:
    name: Nightly Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Coverage baseline
      run: ./scripts/coverage.sh report

    - name: Coverage minimum gate
      run: ./scripts/coverage.sh gate-minimum

    - name: Generate LCOV report
      run: |
        mkdir -p coverage
        cargo llvm-cov --package gatk-core --tests --lcov --output-path coverage/lcov.info

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage/lcov.info
        flags: nightly
        name: nightly-coverage

  nightly-security:
    name: Nightly Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Install cargo-outdated
      run: cargo install cargo-outdated

    # Advisory only: open Dependabot PRs mean the tree is often behind crates.io.
    - name: Check for outdated dependencies
      continue-on-error: true
      run: cargo outdated --workspace

  nightly-docs:
    name: Nightly Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate documentation
      run: cargo doc --workspace --all-features --no-deps

    - name: Check documentation coverage
      run: |
        # Check for undocumented public items
        cargo doc --workspace --all-features --no-deps 2>&1 | grep "warning:" > doc-warnings.txt || true
        if [ -s doc-warnings.txt ]; then
          echo "Documentation warnings found:"
          cat doc-warnings.txt
          exit 1
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/doc
        destination_dir: nightly

  nightly-performance:
    name: Nightly Performance Regression
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-perf-regression-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-perf-regression-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run performance tests
      run: |
        # Run specific performance tests
        cargo test --workspace --release -- --ignored performance_tests

    - name: Compare with baseline
      run: |
        set -euo pipefail
        # Optional prior artifact (release may not publish this file).
        curl -fsSL -o baseline.txt \
          https://github.com/SynapticFour/gatk-rs/releases/latest/download/benchmark-results.json \
          || echo "No baseline found"

        # Criterion packages only — avoid libtest rejecting --output-format.
        cargo bench -p gatk-core -p gatk-haplotypecaller -- --output-format bencher \
          | tee current.txt

        if [[ -s baseline.txt ]] && grep -q 'ns/iter\|bench:' baseline.txt; then
          echo "Performance comparison (raw bencher lines present in baseline):"
          wc -l baseline.txt current.txt
        else
          echo "No comparable baseline; current bencher output captured in current.txt"
        fi

  nightly-integration:
    name: Nightly Integration Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly-integration-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run integration-style contracts
      run: cargo test -p gatk-core --release --tests

    - name: Test with sample data
      run: |
        # Create sample test data
        mkdir -p test-data
        echo ">chr1" > test-data/reference.fa
        echo "ATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCG" >> test-data/reference.fa
        
        # Test CLI with sample data
        timeout 300s cargo run --release --bin gatk-rs -- --help || true
        timeout 300s cargo run --release --bin gatk-rs -- --version || true

  nightly-parity:
    name: Nightly Parity Smoke (Phase 0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parity_profile: [smoke, extended]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Load pinned GATK upstream (Phase A P0)
      run: |
        set -a
        # shellcheck disable=SC1091
        source docs/GATK_PINNED.env
        set +a
        echo "GATK_PINNED_SHA=${GATK_PINNED_SHA}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_IMAGE=${GATK_DOCKER_IMAGE}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_PLATFORM=${GATK_DOCKER_PLATFORM}" >> "${GITHUB_ENV}"

    - name: Pull GATK Docker image
      run: docker pull --platform "${GATK_DOCKER_PLATFORM}" "${GATK_DOCKER_IMAGE}"

    - name: Install samtools (BAM parity comparator)
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: Run foundation gate (phase 0/1 required checks)
      env:
        PARITY_REQUIRE_SAMTOOLS: "1"
        PARITY_SMOKE_PROFILE: ${{ matrix.parity_profile }}
      run: ./scripts/parity/run_foundation_gate.sh

    - name: Upload parity smoke artifact
      uses: actions/upload-artifact@v7
      with:
        name: nightly-parity-smoke-report-${{ matrix.parity_profile }}
        path: parity/reports/

  nightly-hc-full-l2:
    name: Nightly HC full L2 (220 rows)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Load pinned GATK upstream (Phase A P0)
      run: |
        set -a
        # shellcheck disable=SC1091
        source docs/GATK_PINNED.env
        set +a
        echo "GATK_PINNED_SHA=${GATK_PINNED_SHA}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_IMAGE=${GATK_DOCKER_IMAGE}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_PLATFORM=${GATK_DOCKER_PLATFORM}" >> "${GITHUB_ENV}"

    - name: Pull GATK Docker image
      run: docker pull --platform "${GATK_DOCKER_PLATFORM}" "${GATK_DOCKER_IMAGE}"

    - name: Install samtools
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: HC full parity L2 gate (220 rows)
      env:
        PARITY_HC_FULL_L2_STRICT: "1"
        PARITY_REQUIRE_SAMTOOLS: "1"
        PARITY_RUST_PROFILE: release
      run: ./scripts/parity/run_hc_full_parity_l2.sh

    - name: Upload hc-full-parity L2 reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: nightly-hc-full-l2-reports
        path: parity/reports/hc-full-parity-l2/

  nightly-memory:
    name: Nightly Memory Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind

    - name: Build release
      run: cargo build --workspace --release

    - name: Run memory tests
      run: |
        # Test memory usage with valgrind
        timeout 600s valgrind --tool=massif --massif-out-file=massif.out cargo run --release --bin gatk-rs -- --help || true
        
        # Analyze memory usage
        if [ -f massif.out ]; then
          echo "Memory usage analysis:"
          ms_print massif.out.* | head -20
        fi

  notify:
    name: Notify Results
    needs:
      - nightly-test
      - nightly-benchmark
      - nightly-coverage
      - nightly-security
      - nightly-docs
      - nightly-performance
      - nightly-integration
      - nightly-parity
      - nightly-hc-full-l2
      - nightly-memory
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on success
      if: ${{ needs.nightly-test.result == 'success' && needs.nightly-benchmark.result == 'success' && needs.nightly-coverage.result == 'success' && needs.nightly-security.result == 'success' && needs.nightly-docs.result == 'success' && needs.nightly-performance.result == 'success' && needs.nightly-integration.result == 'success' && needs.nightly-parity.result == 'success' && needs.nightly-hc-full-l2.result == 'success' && needs.nightly-memory.result == 'success' }}
      run: |
        echo "All nightly checks passed successfully!"

    - name: Notify on failure
      if: ${{ needs.nightly-test.result == 'failure' || needs.nightly-benchmark.result == 'failure' || needs.nightly-coverage.result == 'failure' || needs.nightly-security.result == 'failure' || needs.nightly-docs.result == 'failure' || needs.nightly-performance.result == 'failure' || needs.nightly-integration.result == 'failure' || needs.nightly-parity.result == 'failure' || needs.nightly-hc-full-l2.result == 'failure' || needs.nightly-memory.result == 'failure' }}
      run: |
        echo "Some nightly checks failed. Please check the logs."
        exit 1
