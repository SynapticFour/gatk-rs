name: P12 L4 Parity

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  P12_REFERENCE: parity/realworld/assets/hs37d5.simple.fa
  CARGO_TARGET_DIR: target

jobs:
  l4-fixtures:
    name: L4 fixture contracts (fast)
    runs-on: ubuntu-latest
    # Cold --release HC compile regularly exceeds 15m on ubuntu-latest.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-p12-l4-fixtures-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-p12-l4-fixtures-

      - name: L4.0 fixture contracts
        run: |
          cargo test -p gatk-haplotypecaller --features parity_harness --test p12_format_parity_test p12_java_format_fixture_contract --release
          cargo test -p gatk-haplotypecaller --features parity_harness --test p12_format_parity_test p12_cluster_format_fixture --release
          cargo test -p gatk-haplotypecaller --features parity_harness --test p12_java_format_fixup_test --release

  l4-signoff:
    name: L4 sign-off battery (BAM required)
    runs-on: ubuntu-latest
    needs: l4-fixtures
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-p12-l4-signoff-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-p12-l4-signoff-

      - name: Stage NA12878 20k BAM
        run: ./scripts/parity/realworld/02_stage_na12878_20k_bam.sh

      - name: Run L4 sign-off battery
        run: ./scripts/parity/run_p12_l4_signoff.sh

      - name: Upload L4 sign-off log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p12-l4-signoff-log
          path: |
            parity/reports/p12_l4_signoff_*.log
            parity/reports/p12_l4_signoff_canonical.log
