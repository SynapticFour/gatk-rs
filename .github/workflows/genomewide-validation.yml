# Full-autosome (or heavy) GIAB validation on a PAID self-hosted runner.
#
# Does NOT run on push/PR. Only:
#   - weekly schedule (Sundays 06:00 UTC)
#   - workflow_dispatch
#
# Cost control: GitHub-hosted jobs start/stop the cloud VM around the paid work.
# Setup + budgeting: operator self-hosted runner runbook (internal)
name: Genomewide validation (self-hosted)

on:
  schedule:
    # Sundays 06:00 UTC — after free-tier giab-genomewide (04:00)
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "GIAB_MODE (prefer autosomes on this runner; smoke for wiring tests)"
        required: true
        default: "autosomes"
        type: choice
        options:
          - autosomes
          - chr20-21
          - ci-subset
          - smoke
      samples:
        description: "Comma-separated GIAB samples"
        required: true
        default: "HG001"
      f1_delta:
        description: "Max |Rust−Java| F1 delta for gatk-rs-equiv gate"
        required: true
        default: "0.02"
      skip_vm_control:
        description: "Skip cloud start/stop (VM already running / manual ops)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: genomewide-validation
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Large machine defaults
  CARGO_BUILD_JOBS: "8"
  RAYON_NUM_THREADS: "8"
  GATK_DOCKER_IMAGE: us.gcr.io/broad-gatk/gatk:4.4.0.0
  GATK_DOCKER_PLATFORM: linux/amd64

jobs:
  # --------------------------------------------------------------------------
  # 1) Power on paid VM (GitHub-hosted — free for public repos)
  # --------------------------------------------------------------------------
  start-vm:
    name: Start cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.skip_vm_control != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start VM + wait for runner
        env:
          # Repository variable (Settings → Secrets and variables → Actions → Variables)
          CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_SERVER_ID: ${{ secrets.HCLOUD_SERVER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          GH_RUNNER_WAIT_TOKEN: ${{ secrets.GH_RUNNER_WAIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUNNER_LABEL: gatk-rs-genomewide
          RUNNER_WAIT_TIMEOUT_SEC: "600"
          CLOUD_VM_BOOT_GRACE_SEC: "120"
        run: |
          set -euo pipefail
          chmod +x scripts/ci/cloud_vmctl.sh
          if [[ -z "${CLOUD_PROVIDER:-}" ]]; then
            echo "::error::Set repository variable CLOUD_PROVIDER=hetzner|aws. See operator self-hosted runner runbook (internal)"
            exit 1
          fi
          ./scripts/ci/cloud_vmctl.sh start

  # --------------------------------------------------------------------------
  # 2) Heavy GIAB work on self-hosted runner (costs money while VM is up)
  # --------------------------------------------------------------------------
  genomewide:
    name: GIAB ${{ github.event.inputs.mode || 'autosomes' }} (self-hosted)
    needs: [start-vm]
    # Run even if start-vm was skipped (manual skip_vm_control) via a dummy path:
    if: ${{ always() && (needs.start-vm.result == 'success' || needs.start-vm.result == 'skipped') }}
    runs-on: [self-hosted, gatk-rs-genomewide]
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show host resources
        run: |
          set -euo pipefail
          echo "=== hostname / disk / mem ==="
          hostname
          df -h
          free -h || true
          nproc

      - name: Install / refresh system deps
        run: |
          set -euo pipefail
          # Prefer pre-provisioned packages (see SELF_HOSTED_RUNNER_SETUP.md).
          # Best-effort refresh without failing the run if sudo is locked down.
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y --no-install-recommends \
              samtools curl time openjdk-17-jre-headless bcftools \
              zlib1g-dev libbz2-dev liblzma-dev pkg-config build-essential \
              docker.io jq unzip || true
          fi
          command -v samtools
          command -v docker

      - name: Install RTG Tools (hap.py fallback)
        run: |
          set -euo pipefail
          ver="3.12.1"
          if [[ ! -x "/opt/rtg-tools-${ver}/rtg" ]]; then
            curl -fsSL -o /tmp/rtg.zip \
              "https://github.com/RealTimeGenomics/rtg-tools/releases/download/${ver}/rtg-tools-${ver}-http.zip"
            sudo unzip -qo /tmp/rtg.zip -d /opt || unzip -qo /tmp/rtg.zip -d "$HOME/opt"
          fi
          if [[ -x "/opt/rtg-tools-${ver}/rtg" ]]; then
            echo "/opt/rtg-tools-${ver}" >> "$GITHUB_PATH"
            echo "RTG_BIN=/opt/rtg-tools-${ver}/rtg" >> "$GITHUB_ENV"
            printf 'y\n' | /opt/rtg-tools-${ver}/rtg version >/dev/null || true
          fi

      - name: Ensure Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gatk-rs + gatk-rs-equiv (release)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -euo pipefail
          # Prefer large disk if provisioned
          if [[ -d /data/cargo-target ]]; then
            echo "CARGO_TARGET_DIR=/data/cargo-target" >> "$GITHUB_ENV"
            export CARGO_TARGET_DIR=/data/cargo-target
          fi
          ./scripts/parity/build_gatk_rs_release.sh
          cargo build -p gatk-rs-equiv --release -j "${CARGO_BUILD_JOBS}"

      - name: Fetch GIAB truth + stratifications
        run: ./scripts/parity/giab/fetch_giab_truthsets.sh

      - name: Stage reference
        run: |
          if [[ ! -f parity/realworld/assets/hs37d5.simple.fa ]]; then
            ./scripts/parity/realworld/03_stage_reference_and_truth.sh
          fi

      - name: Run genomewide equivalence (paid path)
        id: giab_run
        continue-on-error: true
        env:
          GIAB_MODE: ${{ github.event.inputs.mode || 'autosomes' }}
          GIAB_SAMPLES: ${{ github.event.inputs.samples || 'HG001' }}
          GIAB_F1_DELTA_THRESHOLD: ${{ github.event.inputs.f1_delta || '0.02' }}
          GIAB_THREADS: "8"
          GIAB_FETCH_TRUTH: "0"
          GIAB_STAGE_REF: "0"
          GIAB_OUT_ROOT: ${{ github.workspace }}/parity/giab/runs/genomewide
          GIAB_RUN_MIN_FREE_GB: "80"
          CARGO_BUILD_JOBS: "8"
          RAYON_NUM_THREADS: "8"
        run: |
          set -euo pipefail
          source scripts/parity/lib_pinned_gatk.sh
          echo "::notice::PAID RUN — VM compute is billing while this job runs. Mode=${GIAB_MODE} samples=${GIAB_SAMPLES}"
          ./scripts/parity/giab/run_genomewide_equivalence.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genomewide-validation-${{ github.run_id }}
          path: parity/giab/runs/genomewide/**
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if equivalence gate failed
        if: steps.giab_run.outcome != 'success'
        run: |
          echo "Genomewide equivalence gate failed (see artifacts)"
          exit 1

  # --------------------------------------------------------------------------
  # 3) Power off VM — always, to avoid surprise compute bills
  # --------------------------------------------------------------------------
  stop-vm:
    name: Stop cloud VM
    needs: [start-vm, genomewide]
    if: ${{ always() && github.event.inputs.skip_vm_control != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stop VM (preserve disks)
        env:
          CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_SERVER_ID: ${{ secrets.HCLOUD_SERVER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/cloud_vmctl.sh
          ./scripts/ci/cloud_vmctl.sh stop
          echo "::notice::VM stopped. Storage volumes still incur monthly cost — see operator self-hosted runner runbook (internal)#cost-model"

  # Update customer-facing Chart.js site from genomewide JSON (GitHub-hosted).
  publish-parity-site:
    name: Publish public equivalence site
    needs: [genomewide]
    if: always() && needs.genomewide.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download genomewide artifacts
        uses: actions/download-artifact@v8
        with:
          name: genomewide-validation-${{ github.run_id }}
          path: parity/giab/runs/genomewide

      - name: Update parity-site history + commit
        env:
          PARITY_SITE_SOURCE: genomewide
          PARITY_SITE_RUN_DIR: parity/giab/runs/genomewide
          PARITY_SITE_COMMIT: "0"
          PARITY_SITE_PUSH: "0"
        run: |
          set -euo pipefail
          chmod +x scripts/ci/publish_parity_site.sh
          ./scripts/ci/publish_parity_site.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/parity-site/data/history.json docs/parity-site/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(parity-site): genomewide history (${GITHUB_SHA::12})" || true
            # Protected main rejects GITHUB_TOKEN push (GH006); Pages deploy uses workspace files.
            echo "[parity-site] history updated for Pages deploy (no push to main)"
          fi

      - name: Deploy public parity-site to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/parity-site
          keep_files: true
          allow_empty_commit: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Check for run dashboard HTML
        id: gw_dash
        run: |
          if [[ -f parity/giab/runs/genomewide/dashboard/index.html ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      # Keep raw run dashboard under a subpath (does not replace the public site).
      - name: Deploy run dashboard to /genomewide/
        if: steps.gw_dash.outputs.present == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: parity/giab/runs/genomewide/dashboard
          destination_dir: genomewide
          keep_files: true
          allow_empty_commit: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
