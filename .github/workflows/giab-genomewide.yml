# Weekly (and manual) GIAB equivalence: Java GATK4 vs gatk-rs via gatk-rs-equiv.
# Default mode is ci-subset (full chr20+chr21 + autosomal probes) — see scripts/parity/giab/README.md.
name: GIAB genomewide equivalence

on:
  schedule:
    # Sundays 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "GIAB_MODE (smoke|ci-subset|chr20-21|autosomes)"
        required: true
        default: "ci-subset"
      samples:
        description: "Comma-separated samples (HG001,HG002,HG005)"
        required: true
        default: "HG001"
      f1_delta:
        description: "Max |Rust−Java| F1 delta"
        required: true
        default: "0.02"

# contents:write — peaceiris pushes gh-pages; matches nightly-equivalence.yml.
permissions:
  contents: write

concurrency:
  group: giab-genomewide
  cancel-in-progress: false

jobs:
  giab-equivalence:
    name: GIAB equivalence (${{ github.event.inputs.mode || 'ci-subset' }})
    runs-on: ubuntu-latest
    # Rust HC on full chr20+21 is multi-hour; shards resume across restarts but one
    # clean pass still needs headroom beyond the old 360m (cancelled mid-Rust HC).
    timeout-minutes: 900
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bcftools curl time openjdk-17-jre-headless \
            zlib1g-dev libbz2-dev liblzma-dev pkg-config build-essential

      - name: Install RTG Tools (hap.py fallback for gatk-rs-equiv)
        run: |
          set -euo pipefail
          ver="3.12.1"
          # Release assets are linux-x64 / nojre / windows — there is no *-http.zip.
          url="https://github.com/RealTimeGenomics/rtg-tools/releases/download/${ver}/rtg-tools-${ver}-linux-x64.zip"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/rtg.zip "${url}"; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "RTG download failed after ${attempt} attempts: ${url}" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo unzip -q /tmp/rtg.zip -d /opt
          # RTG wants a license acknowledgement file on first run
          printf 'y\n' | /opt/rtg-tools-${ver}/rtg version >/dev/null || true
          echo "/opt/rtg-tools-${ver}" >> "$GITHUB_PATH"
          echo "RTG_BIN=/opt/rtg-tools-${ver}/rtg" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-giab-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-giab-

      - name: Build gatk-rs + gatk-rs-equiv
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          RAYON_NUM_THREADS: "2"
        run: |
          source scripts/parity/m4_disk_guard.sh
          ./scripts/parity/build_gatk_rs_release.sh
          cargo build -p gatk-rs-equiv --release -j "${CARGO_BUILD_JOBS}"

      - name: Fetch GIAB truth sets
        run: ./scripts/parity/giab/fetch_giab_truthsets.sh

      - name: Run genomewide equivalence
        env:
          GIAB_MODE: ${{ github.event.inputs.mode || 'ci-subset' }}
          GIAB_SAMPLES: ${{ github.event.inputs.samples || 'HG001' }}
          GIAB_F1_DELTA_THRESHOLD: ${{ github.event.inputs.f1_delta || '0.02' }}
          GIAB_THREADS: "2"
          GIAB_FETCH_TRUTH: "0"
          GIAB_OUT_ROOT: ${{ github.workspace }}/parity/giab/runs/ci
          CARGO_BUILD_JOBS: "2"
          RAYON_NUM_THREADS: "2"
          RTG_BIN: ${{ env.RTG_BIN }}
          # Prefer Docker GATK pin when no local jar
          GATK_DOCKER_IMAGE: us.gcr.io/broad-gatk/gatk:4.4.0.0
          GATK_DOCKER_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          source scripts/parity/lib_pinned_gatk.sh
          ./scripts/parity/giab/run_genomewide_equivalence.sh
        continue-on-error: true
        id: giab_run

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: giab-genomewide-${{ github.run_id }}
          path: |
            parity/giab/runs/ci/**
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if equivalence gate failed
        if: steps.giab_run.outcome != 'success'
        run: |
          echo "GIAB equivalence gate failed (see artifacts)"
          exit 1

  # Publish under /giab-ci/ so we do not clobber the customer-facing parity-site at Pages root.
  deploy-giab-ci-pages:
    name: Deploy CI dashboard to /giab-ci/
    needs: giab-equivalence
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download run artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: giab-genomewide-${{ github.run_id }}
          path: parity/giab/runs/ci

      - name: Stage dashboard dir
        run: |
          set -euo pipefail
          mkdir -p _giab_ci
          if [[ -d parity/giab/runs/ci/dashboard ]]; then
            cp -a parity/giab/runs/ci/dashboard/. _giab_ci/
          else
            echo '<!DOCTYPE html><html><body><h1>GIAB CI run produced no dashboard</h1></body></html>' > _giab_ci/index.html
          fi
          [[ -f parity/giab/runs/ci/SCOPE.txt ]] && cp parity/giab/runs/ci/SCOPE.txt _giab_ci/SCOPE.txt || true

      - name: Deploy to GitHub Pages (/giab-ci/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _giab_ci
          destination_dir: giab-ci
          keep_files: true
          allow_empty_commit: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
