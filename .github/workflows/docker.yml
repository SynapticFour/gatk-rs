name: Docker

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'gatk-*/**'
  # pull_request disabled — see pr-check.yml for the PR gate.
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: gatkr/gatk-rs
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    # load:true only works for a single platform.
    - name: Build Docker image (amd64)
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: |
          gatkr/gatk-rs:ci
          ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test image
      run: |
        docker run --rm gatkr/gatk-rs:ci --version
        docker run --rm gatkr/gatk-rs:ci --help

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: gatkr/gatk-rs:ci
        format: sarif
        output: trivy-results.sarif
        exit-code: '0'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      continue-on-error: true
      with:
        sarif_file: trivy-results.sarif

  multi-arch:
    name: Multi-Arch Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: linux-amd64
          - platform: linux/arm64
            tag: linux-arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build for platform
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: false
        tags: gatkr/gatk-rs:${{ matrix.tag }}-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  smoke:
    name: Docker Smoke (perf + integration)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: gatkr/gatk-rs:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Performance / CLI smoke
      run: |
        docker images gatkr/gatk-rs:smoke
        time docker run --rm gatkr/gatk-rs:smoke --version
        time docker run --rm gatkr/gatk-rs:smoke --help
        docker run --rm --memory=1g gatkr/gatk-rs:smoke --version || true

    - name: Mount smoke
      run: |
        mkdir -p test-data
        printf '>chr1\nATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCG\n' > test-data/reference.fa
        docker run --rm -v "$(pwd)/test-data:/data" gatkr/gatk-rs:smoke --version
        docker run --rm -v "$(pwd)/test-data:/data" gatkr/gatk-rs:smoke --help

  # secrets.* is not allowed in job-level `if` (actionlint / GH context rules).
  # Probe credentials in a step, then gate push on the job output.
  docker-hub-creds:
    name: Docker Hub credentials
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
    - id: check
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        set -euo pipefail
        if [[ -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "DOCKER_USERNAME/DOCKER_PASSWORD unset; push will be skipped"
        fi

  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, multi-arch, docker-hub-creds]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-hub-creds.outputs.present == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: gatkr/gatk-rs
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
