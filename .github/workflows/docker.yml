name: Docker

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'src/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'src/**'

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: gatkr/gatk-rs
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and test Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm ${{ steps.meta.outputs.tags }} --version
        docker run --rm ${{ steps.meta.outputs.tags }} --help

    - name: Test Docker image functionality
      run: |
        # Create test data
        echo ">chr1" > test.fa
        echo "ATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCG" >> test.fa
        
        # Test basic functionality
        docker run --rm -v $(pwd)/test.fa:/test.fa ${{ steps.meta.outputs.tags }} --help || true

    - name: Run security scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: gatkr/gatk-rs
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  multi-arch:
    name: Multi-Arch Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build for platform
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: false
        tags: gatkr/gatk-rs:${{ matrix.platform }}-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: gatkr/gatk-rs:test

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: 'gatkr/gatk-rs:test'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk security scan
      uses: snyk/actions/docker@0.4.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: gatkr/gatk-rs:test
        args: --severity-threshold=high

  performance-test:
    name: Docker Performance Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: gatkr/gatk-rs:perf-test

    - name: Run performance tests
      run: |
        # Measure image size
        docker images gatkr/gatk-rs:perf-test
        
        # Measure startup time
        time docker run --rm gatkr/gatk-rs:perf-test --version
        
        # Measure help command time
        time docker run --rm gatkr/gatk-rs:perf-test --help
        
        # Test memory usage
        docker run --rm --memory=1g gatkr/gatk-rs:perf-test --version || true

  integration-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: gatkr/gatk-rs:integration-test

    - name: Create test environment
      run: |
        # Create test data directory
        mkdir -p test-data
        
        # Create test reference
        echo ">chr1" > test-data/reference.fa
        echo "ATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCG" >> test-data/reference.fa
        
        # Create test BAM (placeholder)
        echo "BAM_PLACEHOLDER" > test-data/test.bam

    - name: Run integration tests
      run: |
        # Test basic functionality
        docker run --rm -v $(pwd)/test-data:/data gatkr/gatk-rs:integration-test --version
        docker run --rm -v $(pwd)/test-data:/data gatkr/gatk-rs:integration-test --help
        
        # Test with mounted volumes
        docker run --rm -v $(pwd)/test-data:/data gatkr/gatk-rs:integration-test --help || true

    - name: Test Docker Compose
      run: |
        # Create docker-compose.yml for testing
        cat > docker-compose.test.yml << EOF
        version: '3.8'
        services:
          gatk-rs:
            image: gatkr/gatk-rs:integration-test
            volumes:
              - ./test-data:/data
            command: --version
        EOF
        
        # Test docker-compose
        docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit
