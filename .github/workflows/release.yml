name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Ensure GitHub CLI is available
      run: gh --version

    - name: Create release if missing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! gh release view "${GITHUB_REF#refs/tags/}" >/dev/null 2>&1; then
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "GATK-RS ${{ steps.version.outputs.VERSION }}" \
            --notes "Release ${{ steps.version.outputs.VERSION }}"
        fi

  build-and-upload:
    name: Build and Upload
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gatk-rs
            asset_name: gatk-rs-${{ needs.create-release.outputs.version }}-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gatk-rs
            asset_name: gatk-rs-${{ needs.create-release.outputs.version }}-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gatk-rs.exe
            asset_name: gatk-rs-${{ needs.create-release.outputs.version }}-x86_64-pc-windows-msvc.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-${{ matrix.target }}-
          ${{ runner.os }}-cargo-release-

    - name: Build release
      run: cargo build --workspace --release --target ${{ matrix.target }}

    - name: Strip binary (Unix)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Upload release asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${GITHUB_REF#refs/tags/}" \
          "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}#${{ matrix.asset_name }}" \
          --clobber

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-publish-

    - name: Publish gatk-common
      run: cargo publish -p gatk-common
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Publish gatk-core
      run: cargo publish -p gatk-core
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Publish gatk-cli
      run: cargo publish -p gatk-cli
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Publish gatk-haplotypecaller
      run: cargo publish -p gatk-haplotypecaller
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          gatkr/gatk-rs:latest
          gatkr/gatk-rs:${{ needs.create-release.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate documentation
      run: cargo doc --workspace --all-features --no-deps

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/doc
        destination_dir: ${{ needs.create-release.outputs.version }}

  performance-report:
    name: Performance Report
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-perf-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run performance benchmarks
      run: cargo bench -p gatk-core -p gatk-haplotypecaller --benches -- --output-format bencher | tee benchmark-results.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ needs.create-release.outputs.version }}
        path: benchmark-results.json

    - name: Generate performance report
      run: |
        echo "# Performance Report for GATK-RS ${{ needs.create-release.outputs.version }}" > performance-report.md
        echo "" >> performance-report.md
        echo "## Benchmark Results" >> performance-report.md
        echo '```json' >> performance-report.md
        cat benchmark-results.json >> performance-report.md
        echo '```' >> performance-report.md

    - name: Upload performance report to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${GITHUB_REF#refs/tags/}" \
          "performance-report.md#performance-report-${{ needs.create-release.outputs.version }}.md" \
          --clobber
