name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: write  # gitleaks-action uploads SARIF artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Prefer gitleaks-action (do not tar-extract the release into $GITHUB_WORKSPACE —
        # the archive ships README.md with example secrets that false-positive Secret Scan).
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
