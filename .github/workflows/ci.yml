name: CI

on:
  push:
    branches: [ main, develop ]
  # pull_request disabled: free-runner queue was starved by CI×OS×toolchain matrix on every PR.
  # PR gate is `.github/workflows/pr-check.yml` only.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Match pr-check.yml: huge HC test bins + full debuginfo fill ubuntu-latest and
  # rust-lld dies with signal 7 (bus error). Shrink debuginfo globally for this workflow.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    # Windows hts-sys native build is frequently broken on GH runners; don't block CI.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Exclude nightly on Windows for faster CI
          - os: windows-latest
            rust: nightly
          # Exclude beta on Windows for faster CI
          - os: windows-latest
            rust: beta

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/ci/free_runner_disk.sh
        ./scripts/ci/free_runner_disk.sh

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache Cargo registry (Linux — no target/)
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        # Restoring a fat target/ plus rebuilding tests exhausts ubuntu-latest disk
        # (pr-check uses cache-targets: false for the same reason).
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-reg-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-reg-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-reg-

    - name: Cache Cargo (macOS/Windows — include target/)
      if: runner.os != 'Linux'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Install samtools (fixture BAM staging)
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          brew install samtools
        else
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends samtools
        fi
        command -v samtools

    - name: Stage indexed BAMs from fixture SAMs
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        chmod +x scripts/ci/stage_indexed_fixture_bams.sh
        ./scripts/ci/stage_indexed_fixture_bams.sh

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      # Lint debt: warn-only, libs/bins only (integration tests need feature gates).
      run: cargo clippy --workspace

    - name: Build
      run: cargo build --workspace --verbose

    - name: Run tests
      # Match pr-check.yml: integration tests need `parity_harness` (pub P12 surface).
      run: cargo test -j 1 --workspace --all-features --verbose

    - name: Run canonical gatk-core tests
      run: cargo test -j 1 -p gatk-core --release --tests --all-features

    - name: Generate documentation
      run: cargo doc --workspace --no-deps

  # Required (not nightly-only): byte-identical HC VCF across RAYON_NUM_THREADS=1/2/4/8/16.
  rayon-determinism:
    name: HC Rayon thread determinism
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-rayon-det-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-rayon-det-

    - name: Rayon thread determinism gate
      env:
        CARGO_BUILD_JOBS: "1"
      run: cargo test -p gatk-cli --test rayon_thread_determinism_test -- --nocapture

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Phase A coverage baseline (report only)
      run: ./scripts/coverage.sh report

    - name: Phase B coverage minimum gate
      run: ./scripts/coverage.sh gate-minimum

    # Phase C (gate-priority) is opt-in locally via ./scripts/coverage.sh gate-priority;
    # full-package gate-minimum already enforces the ratchet in CI.

    - name: Generate LCOV report
      run: |
        mkdir -p coverage
        cargo llvm-cov --package gatk-core --tests --lcov --output-path coverage/lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Criterion benches use local fixtures; keep signal without blocking merge gates.
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bench-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run benchmarks
      run: cargo bench --workspace

    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: target/criterion/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Install cargo-deny
      run: cargo install cargo-deny

    - name: Run cargo-deny
      run: cargo deny check

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-integration-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run integration-style contracts
      run: cargo test -p gatk-core --release --tests

    - name: Test CLI functionality
      run: |
        # Test basic CLI functionality
        cargo run --release --bin gatk-rs -- --help
        cargo run --release --bin gatk-rs -- --version

    - name: Test memory management
      run: |
        # Test with memory limits
        timeout 300s cargo run --release --bin gatk-rs -- --java-options "-Xmx1G" --help || true

  p12-l4-fixtures:
    name: P12 L4 fixture contracts (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-p12-l4-fixtures-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-p12-l4-fixtures-

    - name: L4 fixture contracts
      run: |
        cargo test -p gatk-haplotypecaller --features parity_harness --test p12_format_parity_test p12_java_format_fixture_contract --release
        cargo test -p gatk-haplotypecaller --features parity_harness --test p12_format_parity_test p12_cluster_format_fixture --release
        cargo test -p gatk-haplotypecaller --features parity_harness --test p12_java_format_fixup_test --release

  hc-full-parity-l5-fixtures:
    name: HC L5.0 + h1-inactive (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-hc-l5-fixtures-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-hc-l5-fixtures-

    - name: Install samtools
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: Stage NA12878 20k BAM (P12 inactive row)
      run: ./scripts/parity/realworld/02_stage_na12878_20k_bam.sh

    - name: L5.0 gVCF header + block fixtures
      env:
        PARITY_RUST_PROFILE: release
      run: ./scripts/parity/run_hc_full_parity_h2_gvcf.sh

    - name: h1-inactive reference model (2 rows)
      env:
        PARITY_RUST_PROFILE: release
      run: ./scripts/parity/run_hc_full_parity_h1_inactive.sh

  hc-full-parity-ci1:
    name: HC Full Parity CI.1 (phases B–J + L2 strict)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Free disk space
      run: |
        chmod +x scripts/ci/free_runner_disk.sh
        ./scripts/ci/free_runner_disk.sh

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Load pinned GATK upstream
      run: |
        set -a
        # shellcheck disable=SC1091
        source docs/GATK_PINNED.env
        set +a
        echo "GATK_PINNED_SHA=${GATK_PINNED_SHA}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_IMAGE=${GATK_DOCKER_IMAGE}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_PLATFORM=${GATK_DOCKER_PLATFORM}" >> "${GITHUB_ENV}"

    - name: Pull GATK Docker image
      run: docker pull --platform "${GATK_DOCKER_PLATFORM}" "${GATK_DOCKER_IMAGE}"

    - name: Install samtools
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: HC full parity phase bundles B–J + strict L2
      env:
        PARITY_HC_FULL_L2_STRICT: "1"
        PARITY_REQUIRE_SAMTOOLS: "1"
        PARITY_RUST_PROFILE: release
        CARGO_PROFILE_DEV_DEBUG: "0"
        CARGO_PROFILE_TEST_DEBUG: "0"
        CARGO_BUILD_JOBS: "1"
      run: ./scripts/parity/run_hc_full_parity_ci1.sh

    - name: L3 real-world parity (strict, bundled golden)
      env:
        PARITY_HC_REALWORLD_STRICT: "1"
        PARITY_HC_REALWORLD_JAVA_CHECK: "1"
        # Full 220-row L2 runs nightly (`nightly-hc-full-l2`); skip here to keep CI wall time bounded.
        PARITY_SKIP_HC_FULL_L2: "1"
      run: ./scripts/parity/run_hc_realworld_parity.sh

    - name: Upload hc-full-parity reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: hc-full-parity-ci1-reports
        path: |
          parity/reports/hc-full-parity-l2/
          parity/reports/hc-realworld-out.vcf
          parity/reports/hc-realworld-java.vcf

  parity-smoke:
    name: Parity Smoke (Phase 1)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Load pinned GATK upstream (Phase A P0)
      run: |
        set -a
        # shellcheck disable=SC1091
        source docs/GATK_PINNED.env
        set +a
        echo "GATK_PINNED_SHA=${GATK_PINNED_SHA}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_IMAGE=${GATK_DOCKER_IMAGE}" >> "${GITHUB_ENV}"
        echo "GATK_DOCKER_PLATFORM=${GATK_DOCKER_PLATFORM}" >> "${GITHUB_ENV}"

    - name: Pull GATK Docker image
      run: docker pull --platform "${GATK_DOCKER_PLATFORM}" "${GATK_DOCKER_IMAGE}"

    - name: Install samtools (BAM parity comparator)
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: Run foundation gate (phase 0/1 required checks)
      env:
        PARITY_REQUIRE_SAMTOOLS: "1"
      run: ./scripts/parity/run_foundation_gate.sh

    - name: Upload parity report artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: parity-smoke-report
        path: parity/reports/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate documentation
      run: cargo doc --workspace --all-features --no-deps

    - name: Check documentation links
      run: cargo doc --workspace --all-features --no-deps --document-private-items

    - name: Upload documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: target/doc/

  cross-platform:
    name: Cross Platform Tests
    runs-on: ${{ matrix.os }}
    # Windows hts-sys native build is frequently broken on GH runners; don't block CI.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-cross-${{ matrix.target }}-
          ${{ runner.os }}-cargo-cross-

    - name: Build for target
      run: cargo build --workspace --target ${{ matrix.target }}

    - name: Test for target
      run: cargo test --workspace --all-features --target ${{ matrix.target }} --lib
