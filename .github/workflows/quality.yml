name: Code Quality

on:
  push:
    branches: [ main, develop ]
  # pull_request disabled — see pr-check.yml for the PR gate.
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-quality-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      # Lint debt: warn-only, libs/bins only (integration tests need feature gates).
      run: cargo clippy --workspace

    - name: I/O unwrap policy (guarded modules)
      run: python3 scripts/dev/check_io_unwrap_policy.py

    - name: Unsafe-pattern ratchets (unwrap + clone)
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          export UNSAFE_PATTERNS_BASE_REF="origin/${GITHUB_BASE_REF}"
        fi
        ./scripts/dev/count_unsafe_patterns.sh check

    - name: Check documentation
      run: cargo doc --workspace --all-features --no-deps --document-private-items

    - name: Excellence quality gates (Sprint N)
      run: python3 scripts/parity/excellence_gates_audit.py


    - name: Malformed-input no-panic tests
      run: cargo test -p gatk-haplotypecaller --test malformed_input_no_panic_test -- --nocapture

  # Required: same BAM/ref → byte-identical VCF across Rayon thread counts (1/2/4/8/16).
  rayon-determinism:
    name: HC Rayon thread determinism
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-rayon-det-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-rayon-det-
          ${{ runner.os }}-cargo-

    - name: Install samtools (BAM index if needed)
      run: sudo apt-get update && sudo apt-get install -y samtools

    - name: Rayon thread determinism gate
      env:
        CARGO_BUILD_JOBS: "1"
      run: cargo test -p gatk-cli --test rayon_thread_determinism_test -- --nocapture

  # PR-only: dependency-review-action needs base/head refs (see dependency-review.yml).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Dependency Review
      uses: actions/dependency-review-action@v5

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install cargo-deny
      run: cargo install cargo-deny

    - name: Run license check
      run: cargo deny check licenses

  complexity-analysis:
    name: Complexity Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-cyclonedx
      run: cargo install cargo-cyclonedx

    - name: Generate SBOM
      # cargo-cyclonedx 0.5.x: -f is format; writes <crate>/sbom.json per member.
      run: cargo cyclonedx -f json --override-filename sbom

    - name: Upload SBOM
      uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: '**/sbom.json'

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Coverage baseline
      run: ./scripts/coverage.sh report

    - name: Coverage minimum gate
      run: ./scripts/coverage.sh gate-minimum

    - name: Generate LCOV report
      run: |
        mkdir -p coverage
        cargo llvm-cov --package gatk-core --tests --lcov --output-path coverage/lcov.info

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/

  performance-regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-perf-

    - name: Build release
      run: cargo build --workspace --release

    - name: Run benchmarks
      run: |
        set -euo pipefail
        # Criterion targets only (lib.bench=false + harness=false); libtest rejects --output-format.
        cargo bench -p gatk-core -p gatk-haplotypecaller --benches -- --output-format bencher \
          | tee benchmark-results.txt

    - name: Compare with baseline
      run: |
        set -euo pipefail
        cp benchmark-results.txt /tmp/pr-bench.txt
        git checkout origin/main
        cargo build --workspace --release
        cargo bench -p gatk-core -p gatk-haplotypecaller --benches -- --output-format bencher \
          | tee baseline.txt
        git checkout ${{ github.sha }}
        echo "Performance comparison completed (bencher format)"
        wc -l /tmp/pr-bench.txt baseline.txt
        head -n 20 /tmp/pr-bench.txt

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Install cargo-deny
      run: cargo install cargo-deny

    - name: Run cargo-deny
      run: cargo deny check

  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check documentation (broken intra-doc links)
      env:
        # Fail closed on broken links; do not treat style/private-item warnings as errors.
        RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      run: cargo doc --workspace --all-features --no-deps

    - name: Check README sections
      run: |
        set -euo pipefail
        for heading in "## Build and run" "## Validated Scope" "## License"; do
          if ! grep -qF "${heading}" README.md; then
            echo "README missing section: ${heading}"
            exit 1
          fi
        done

    - name: Validate examples
      run: cargo test --workspace --doc
