[package]
name = "gatk-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for gatk-rs: HaplotypeCaller + Combine/Genotype/hard-filter spine (scoped experiment)"
rust-version.workspace = true

[[bin]]
name = "gatk-rs"
path = "src/main.rs"

[features]
default = []
# `cargo build -p gatk-cli --release --locked --features jemalloc`
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
# Workspace dependencies
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-htslib.workspace = true

# Internal dependencies
gatk-core = { path = "../gatk-core" }
gatk-common = { path = "../gatk-common" }
gatk-haplotypecaller = { path = "../gatk-haplotypecaller", features = ["dev-dumps"] }

# External dependencies
colored = "3.1"
console = "0.16"

# Optional allocator for Peak-RSS (GIAB / dense windows). Off by default.
tikv-jemallocator = { version = "0.6", optional = true }

# Benchmarking dependencies
chrono.workspace = true
num_cpus.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3"
