[package]
name = "gatk-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "I/O and shared types for the gatk-rs germline short-variant spine"
rust-version.workspace = true

[features]
default = []

# Criterion lives in benches/; disable libtest's implicit lib bench harness so
# `cargo bench -- --output-format bencher` is not rejected before Criterion runs.
[lib]
bench = false

[dependencies]
# Workspace dependencies
rayon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ndarray.workspace = true
statrs.workspace = true
num-traits.workspace = true
uuid.workspace = true
chrono.workspace = true
indexmap.workspace = true
itertools.workspace = true
memmap2.workspace = true
crossbeam.workspace = true
dashmap.workspace = true
lru.workspace = true
bytes.workspace = true
tokio.workspace = true
parking_lot.workspace = true
gatk-common = { path = "../gatk-common" }

# External dependencies
tracing = "0.1"
smallvec = "1.11"
bytemuck = "1.14"
flate2 = "1.0"
rust-htslib = "0.48"
hts-sys = { workspace = true }

# Benchmarking dependencies
num_cpus.workspace = true
fastrand.workspace = true
tempfile.workspace = true

# Distributed Computing dependencies
polars.workspace = true
futures.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
fastrand = "2.0"
tokio-test = "0.4"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "benchmark_suite"
harness = false

[[bench]]
name = "io_benchmarks"
harness = false

[[bench]]
name = "bam_sam_benchmarks"
harness = false

[[bench]]
name = "vcf_benchmarks"
harness = false

[[bench]]
name = "macro_benchmarks"
harness = false
