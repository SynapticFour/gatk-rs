[package]
name = "gatk-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "I/O and shared types for the gatk-rs germline short-variant spine"
rust-version.workspace = true

[features]
default = []

# Criterion lives in benches/; disable libtest's implicit lib bench harness so
# `cargo bench -- --output-format bencher` is not rejected before Criterion runs.
[lib]
bench = false

[dependencies]
# Workspace dependencies
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
num-traits.workspace = true
indexmap.workspace = true
itertools.workspace = true
memmap2.workspace = true
gatk-common = { path = "../gatk-common" }

# External dependencies
tracing = "0.1"
flate2 = "1.0"
rust-htslib = "1.0"
hts-sys = { workspace = true }

# Benchmarking / tests
fastrand.workspace = true
tempfile.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
fastrand = "2.0"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "io_benchmarks"
harness = false

[[bench]]
name = "bam_sam_benchmarks"
harness = false

[[bench]]
name = "vcf_benchmarks"
harness = false

[[bench]]
name = "macro_benchmarks"
harness = false
