# cargo-deny config for gatk-rs (Apache-2.0).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive, no patched release on the locked versions we consume today.
# Revisit when rust-htslib / polars bump past these advisories.
ignore = [
    # rust-htslib → custom_derive (unmaintained; no safe upgrade)
    "RUSTSEC-2025-0058",
    # polars 0.38 → fast-float 0.2.0 (no release; fork only)
    "RUSTSEC-2025-0003",
    # transitive informational / unmaintained until next lock refresh
    "RUSTSEC-2024-0379",
    "RUSTSEC-2026-0186",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# ring ships a combined MIT/ISC/OpenSSL expression that needs clarification.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
